[workspace]
resolver = "2"
members = [
    "crates/phenotyper",
    "crates/phenotyper-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
description = "A domain-specific language and compiler for defining the shape of structured textual artifacts and generating typed tooling that can construct, render, validate, and eventually parse them."
keywords = ["dsl", "codegen", "compiler", "text-generation", "code-generation"]
categories = ["compilers", "development-tools::build-utils", "text-processing"]
repository = "https://github.com/a1v0lut10n/phenotyper"
homepage = "https://github.com/a1v0lut10n/phenotyper"
readme = "README.md"
authors = ["Hans Van Wesenbeeck <hvw@aivolution.ch>"]

[workspace.dependencies]
# Parser runtime
rustemo = { version = "0.9.1", features = ["glr"] }

# Error handling
thiserror = "2"

# Serialization (for JSON diagnostics)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Internal crates
phenotyper = { path = "crates/phenotyper" }
